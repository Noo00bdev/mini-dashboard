<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Dashboard</title>
  <script type="module" crossorigin src="/mini-dashboard/assets/scripts-Vi0_Orri.js"></script>
  <link rel="stylesheet" crossorigin href="/mini-dashboard/assets/input-CLFvTMBp.css">
</head>
<body class="bg-background w-full h-full relative m-0 p-0">
    <main class="mt-28 md:mt-8 md:flex md:justify-center md:items-center md:flex-col md:p-4" >
        <section class=" bg-background flex flex-col display-flex align-items-center" >
            <h1 class="text-center font-bold md:text-5xl md:mb-2">Bienvenue</h1>
            <p class="text-center">Connectez-vous à votre tableau de bord ou créer un compte</p>
        </section>
        <section class="mt-14 p-8 bg-foreground flex flex-col md:rounded-lg md:p-20 md:mt-4">
            <div class="flex justify-around  gap-12 border-b border- pb-2">
                <button class="btnlog hover:text-primary" id="signingBtn">Connexion</button>
                <button id="signupBtn"  class=" btnlog hover:text-primary">Inscription</button>
            </div>
            <form action=""  class="mt-8 flex flex-col gap-4" id="loginForm">
                <label for="email">Email</label>
                <input type="email" name="" id="email" placeholder="@  email@gmail.com..." class="border border-b-black rounded p-2">
                <label for="password">Mot de passe</label>
                <input type="password" name="" id="password" placeholder="🔒 ************" class="border border-b-black rounded p-2">
                <div class="flex justify-between gap-2">
                    <div class="flex flex-row items-center gap-2 ">
                        <input type="checkbox" name="" id="rememberMe">
                        <label for="rememberMe" class="text-xs">Se souvenir de moi</label>
                    </div>
                    <p class="text-xs text-primary font-bold">Mot de passe oublié ?</p>
                </div>
                <input type="submit" value="Se connecter" class="text-xs text-foreground rounded bg-primary p-2 duration-700 hover:bg-background hover:text-primary " id="connexion">
                <div class="flex items-center gap-2 ">
                    <hr class="flex-1">
                        <p>Ou continuer avec</p>
                    <hr class="flex-1">
                </div>
                <div class="flex items-center justify-center gap-2">
                    <button class="p-2 flex-1 border rounded"><i class="fa-brands fa-github"></i></button>
                    <button class="p-2 flex-1 border rounded"><i class="fa-brands fa-google"></i></button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p class="text-center text-xl p-4">@ 2025 NintchDev. Tous droits reservés</p>
    </footer>
</body>
</html>
