<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/input.css">
    <script src="https://kit.fontawesome.com/41b72b8ae0.js" crossorigin="anonymous"></script>
    <title>Task</title>
</head>
<body class="bg-foreground w-full h-full relative m-0 p-0">
    <header class="">
        <div class="fixed bottom-0 md:left-0 md:top-0
            bg-foreground md:bg-background
            border-t md:border-t-0 md:border-r-2
            border-border-light
            w-full md:w-[120px] h-16 md:h-full
            z-40">
            <ul class="flex w-full justify-between p-2 md:flex-col md:gap-5">
                <div class="hidden md:block border-b border-gray-300 pb-2 mb-0 w-full">
                    <p class="hidden md:block text-text-primary font-bold">Mon tableau</p>
                </div>
                <li class="nav-item w-fit flex items-center flex-col md:flex-row md:gap-1.5">
                    <a href="main.html"><i class="fa-solid fa-house text-us "></i></a>
                    <a href="main.html" class="btnNav text-xs text-text-secondary  rounded hover:text-user-icon " id="home-text">Accueil</a>
                </li>
                <li class="nav-item w-fit flex items-center flex-col md:flex-row md:gap-1.5">
                    <a href="#"><i class="fa-solid fa-square-check text-primary"></i></a>
                    <a href="#" class="btnNav text-xs text-primary rounded hover:text-user-icon" id="task-text">Tâches</a>
                </li>
                <li class="nav-item w-fit flex items-center flex-col md:flex-row md:gap-1.5">
                    <a href="statistic.html"><i class="fa-solid fa-chart-column"></i></a>
                    <a href="statistic.html" class="btnNav text-text-secondary text-xs rounded hover:text-user-icon" id="statistic-text">Statistiques</a>
                </li>
                <li class="nav-item w-fit flex items-center flex-col md:flex-row md:gap-1.5">
                    <a href="parameter.html"><i class="fa-solid fa-gear"></i></a>
                    <a href="parameter.html" class="btnNav text-text-secondary text-xs rounded hover:text-user-icon" id="settings-text">Paramètres</a>
                </li>
            </ul>
        </div>
        <div class="flex flex-row justify-between pb-4 mb-4 p-2 md:ml-32 border-b border-gray-300 md:border-none relative z-50">
            <p class="font-bold text-text-primary md:text-xs mt-1">Tâches</p>
            <button class="bg-primary flex flex-row items-center gap-1 pl-2 pr-2 rounded-xs cursor-pointer" id="btnAddTask">
                <i class="fa-solid fa-plus" style="color: #FFFFFF;"></i>
                <span class="hidden md:block lg:block text-text font-medium">Nouvelle Tâche</span>
            </button>
        </div>
    </header>
    <main class="md:ml-32 pb-20 relative z-10">
        <section class="">
            <div class="flex flex-col md:flex-row justify-between gap-4 p-3">
                <!-- Search container -->
                <div class="relative flex-1 min-w-0">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
                       style="color: var(--color-text-secondary)"></i>
                    <input
                            type="text"
                            class="w-full pl-10 pr-3 py-2 rounded-lg border-2 border-border-light placeholder-text-secondary bg-background min-w-0"
                            placeholder="Rechercher une tâche..."
                            id="task-search-input"
                    />
                </div>

                <!-- Selects -->
                <div class="flex flex-row gap-4 relative z-20">
                    <select class="bg-background p-2.5 rounded-lg" id="statusSelect">
                        <option value="" selected>Status</option>
                        <option value="a faire">A faire</option>
                        <option value="en cours">En cours</option>
                    </select>


                    <select class="bg-background p-2.5 rounded-lg" disabled>
                        <option disabled selected>Date Fin</option>
                        <option value="low">Proche</option>
                        <option value="medium">Moyenne</option>
                        <option value="high">Lointain</option>
                    </select>

                    <select class="bg-background p-2.5 rounded-lg" id="prioritySelect">
                        <option value="" selected>Priorité</option>
                        <option value="Petite">Petite</option>
                        <option value="Moyenne">Moyenne</option>
                        <option value="Haute">Haute</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="relative z-50">
            <div id="taskAddContainer" class="m-4">
                <!-- VOS TÂCHES -->
            </div>
        </section>
    </main>
    <script type="module" src="/scripts.js" ></script>
</body>
</html>
