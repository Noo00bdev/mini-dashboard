<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/41b72b8ae0.js" crossorigin="anonymous"></script>
    <title>Dashboard</title>
  <script type="module" crossorigin src="/mini-dashboard/assets/scripts-DqKkOazZ.js"></script>
  <link rel="stylesheet" crossorigin href="/mini-dashboard/assets/input-5mEeNQDB.css">

<body class="bg-background w-full h-full relative m-0 p-0">
    <header class="">
        <div class="fixed bottom-0 md:left-0 md:top-0
            bg-foreground md:bg-background
            border-t md:border-t-0 md:border-r-2
            border-border-light
            w-full md:w-[120px] h-16 md:h-full
            z-40">
            <ul class="flex w-full justify-between p-2 md:flex-col md:gap-5">
                <div class="hidden md:block border-b border-gray-300 pb-2 mb-0 w-full">
                    <p class="hidden md:block text-text-primary font-bold">Mon tableau</p>
                </div>
                <li class="nav-item w-fit flex items-center flex-col md:flex-row md:gap-1.5">
                    <a href="#"><i class="fa-solid fa-house text-us text-primary"></i></a>
                    <a href="#" class="btnNav text-xs text-user-icon  rounded hover:text-user-icon " id="home-text">Accueil</a>
                </li>
                <li class="nav-item w-fit flex items-center flex-col md:flex-row md:gap-1.5">
                    <a href="task.html"><i class="fa-solid fa-square-check"></i></a>
                    <a href="task.html" class="btnNav text-xs text-text-secondary rounded hover:text-user-icon" id="task-text">Tâches</a>
                </li>
                <li class="nav-item w-fit flex items-center flex-col md:flex-row md:gap-1.5">
                    <a href="statistic.html"><i class="fa-solid fa-chart-column"></i></a>
                    <a href="statistic.html" class="btnNav text-text-secondary text-xs rounded hover:text-user-icon" id="statistic-text">Statistiques</a>
                </li>
                <li class="nav-item w-fit flex items-center flex-col md:flex-row md:gap-1.5">
                    <a href="parameter.html"><i class="fa-solid fa-gear"></i></a>
                    <a href="parameter.html" class="btnNav text-text-secondary text-xs rounded hover:text-user-icon" id="settings-text">Paramètres</a>
                </li>
            </ul>
        </div>
        <div class="relative   flex flex-row justify-between items-center pb-4 mb-4 p-2 md:ml-32  border-b border-gray-300 md:border-none">
            <p class="font-bold text-text-primary md:text-xs md:fixed md:top-3">Tableau de Bord</p>
            <div class="flex">
                <input name="search" id="search-input" placeholder="Rechercher..." class="focus:outline-none hidden md:block rounded-xl bg-white border-2 border-border-light placeholder-text-secondary placeholder:text-xs placeholder:p-4 placeholder:mb-2 md:w-56 md:fixed right-1 md:top-2 ">
            </div>
        </div>
        
    </header>
    <main class="md:mt-10 md:ml-32 overflow-y-auto h-fit pb-10">
        <section class = "flex flex-col gap-4 p-4 sm:grid sm:grid-cols-2 md:flex md:flex-row md:gap-4 md:justify-around">
            <div class="bg-white p-4 rounded-xl flex flex-col md:flex-1">Vente :
                <span id="ventes"></span>
            </div>
            <div class="bg-white p-4 flex flex-col rounded-xl md:flex-1">Meilleur Ventes:
                <span id="bestSales"></span>
            </div>
            <div class="bg-white p-4 flex flex-col rounded-xl md:flex-1">Pire ventes:
                <span id="worstSales"></span>
            </div>
            <div class="bg-white p-4 flex flex-col rounded-xl md:flex-1">Moyenne des ventes:
                <span id="moySales"></span>
            </div>
            
        </section>
        <section class="md:flex md:flex-col lg:flex lg:flex-row p-4">
            <section class="m-1 md:flex-4 md:m-2">
                <div class="flex gap-3 w-fit mb-2 md:absolute  p-2 rounded-2xl" >
                    <button id="modify" class="bg-blue-400 p-1 hover:bg-blue-700/70 rounded-xs">
                        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAABiElEQVR4AexUSVbDMAyVOAJsawOHYMXNuAAXY8kdmidnCVdAaHBSp3aGpq+7+sVTLP8vf8l+gBuXOwEQ0VdKxCmln5baV0kk4EdEfAdAkPKUKLH0k283gYID4oujZVwEkJP8+j9vdxEoOCI4eMaGU3k8DQEuJnBwFHB0nNzZxMj428a5uYhgBBegEAIy8yfIGACtY+AuhPgGRdlMQD1pQMVzgBCD+f0c48eIxdzFGF/HeR5sIjDP/9DBxfO8VwPK4jzISZrgardKYOA5W1QW3aRVsoW1XwLX9UWCCXiWRTcN4BKEWc/VTussQU+D5gxtz7E7NDRX0LI2CYj6I6ssIoJkBQ4bBs8ZNaCHKqCDXdlXBC4Le0BLWfIzYJof6mwpQcvxhMDB0cGLbKHkb4yBb5BllgBVFlmdak6M8k8vUSvPZWnxm5zALNlaa/x1lFs6c4nMaKWpCWSDBlOrDOUS4Woqqt1crQlUD3lZ9CAuy7Zs2USg2nuNGCXIezQ/J6pPcG5x5fzmBP8AAAD//8/GuZUAAAAGSURBVAMA+2a0MXooJtwAAAAASUVORK5CYII=" alt="" >
                    </button>
                </div>
                <div class="bg-white p-5 rounded-2xl">
                    <canvas id="myChart" class="w-full h-64"></canvas>
                </div>
                <div id="modify-form" class=" p-2 rounded-2xl bg-white mt-2 hidden">
                    <h2 class="text-text-primary font-bold border-b border-gray-300 pb-2 mb-0 w-full">
                        Panel de modification du graphique
                    </h2>
                    <div class=" p-5 rounded-2xl mt-2 flex flex-row justify-between items-center">

                        <label for="" class="border-b border-gray-300 pb-2 mb-0 w-full">
                            Mois
                        </label>
                        <div id="months-container" class="flex gap-2 flex-wrap mb-2">
                            <!-- Les cases à cocher pour les mois seront ajoutées ici dynamiquement -->
                        </div>
                        <label for="" class="border-b border-gray-300 pb-2 mb-0 w-full">
                            Valeurs($)
                        </label>

                    </div>
                    <div class="flex flex-col gap-2">
                        <div id="values-container" tabindex="0"  class="flex gap-2 flex-wrap mb-2">
                            <!-- Les cases à cocher pour les valeurs seront ajoutées ici dynamiquement -->
                        </div>
                        <div class="flex gap-4 justify-end">
                            <button id="add-month-btn" class="bg-user-icon/50 p-2 hover:bg-blue-300/70 rounded-xs text-user-icon font-bold">
                                Add Month
                            </button>
                            <button id="save-btn" class="bg-user-icon p-3  hover:bg-blue-700/70 rounded-xs text-white font-bold">
                                Save
                            </button>
                        </div>
                    </div>

                </div>
            </section>
            <section class="m-2 md:m-1 md:flex-2">
                <h1 class="text-center font-bold text-text-primary text-4xl m-4">Tâches récentes </h1>
                <div class="bg-white p-5 rounded-2xl" id="recTask">

                </div>
            </section>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>

</html>
